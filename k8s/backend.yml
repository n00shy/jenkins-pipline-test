apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:

      - name: backend

        image: abdullahahmed1101076/dataflow-backend:0

        ports:
        - containerPort: 5000

        env:

        - name: MONGODB_URI
          value: mongodb://mongo:27017/dataflow

        - name: FRONTEND_URL
          value: http://frontend
